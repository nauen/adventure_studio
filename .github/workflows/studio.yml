name: Gradio Studio UI smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/studio.yml'
      - '.devcontainer/devcontainer.json'
      - '.devcontainer/start-studio.sh'
      - '.devcontainer/setup.sh'
      - '.devcontainer/install-scummc.sh'
      - 'pyproject.toml'
      - 'src/adventure_studio/studio_service.py'
      - 'src/adventure_studio/story_ai.py'
      - 'src/adventure_studio/studio_catalog.py'
      - 'src/adventure_studio/ai_provider.py'
      - 'src/adventure_studio/story_protocol.py'
      - 'src/adventure_studio/story.py'
      - 'src/adventure_studio/story_document.py'
      - 'src/adventure_studio/story_changes.py'
      - 'src/adventure_studio/studio_export.py'
      - 'src/adventure_studio/studio_gradio.py'
      - 'src/adventure_studio/studio_sequences.py'
      - 'tests/test_studio_service.py'
      - 'tests/test_story_ai.py'
      - 'tests/test_studio_catalog.py'
      - 'tests/test_story_protocol.py'
      - 'tests/test_story_v4.py'
      - 'tests/test_studio_export.py'
      - 'tests/test_studio_position.py'
      - 'tests/test_dialogue_animation.py'
      - 'tests/gradio_browser_dialogue.py'
      - 'tests/gradio_browser_boxm.py'
      - 'tests/gradio_browser_scal.py'
      - 'tests/gradio_browser_zplanes.py'
      - 'tests/gradio_browser_object_zmask.py'
  pull_request:
    paths:
      - '.github/workflows/studio.yml'
      - '.devcontainer/devcontainer.json'
      - '.devcontainer/start-studio.sh'
      - '.devcontainer/setup.sh'
      - '.devcontainer/install-scummc.sh'
      - 'pyproject.toml'
      - 'src/adventure_studio/studio_service.py'
      - 'src/adventure_studio/story_ai.py'
      - 'src/adventure_studio/studio_catalog.py'
      - 'src/adventure_studio/ai_provider.py'
      - 'src/adventure_studio/story_protocol.py'
      - 'src/adventure_studio/story.py'
      - 'src/adventure_studio/story_document.py'
      - 'src/adventure_studio/story_changes.py'
      - 'src/adventure_studio/studio_export.py'
      - 'src/adventure_studio/studio_gradio.py'
      - 'src/adventure_studio/studio_sequences.py'
      - 'tests/test_studio_service.py'
      - 'tests/test_story_ai.py'
      - 'tests/test_studio_catalog.py'
      - 'tests/test_story_protocol.py'
      - 'tests/test_story_v4.py'
      - 'tests/test_studio_export.py'
      - 'tests/test_studio_position.py'
      - 'tests/test_dialogue_animation.py'
      - 'tests/gradio_browser_dialogue.py'
      - 'tests/gradio_browser_boxm.py'
      - 'tests/gradio_browser_scal.py'
      - 'tests/gradio_browser_zplanes.py'
      - 'tests/gradio_browser_object_zmask.py'

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install optional UI dependencies
        run: python -m pip install -e '.[studio]'
      - name: Verify deterministic editor service
        run: |
          python -m unittest discover -s tests -p test_studio_service.py -v
          python -m unittest discover -s tests -p test_studio_export.py -v
          python -m unittest discover -s tests -p test_studio_position.py -v
          python -m unittest discover -s tests -p test_story_ai.py -v
          python -m unittest discover -s tests -p test_studio_catalog.py -v
          python -m unittest discover -s tests -p test_studio_sequences.py -v
          python -m unittest discover -s tests -p test_dialogue_animation.py -v
          python -m unittest discover -s tests -p test_story_protocol.py -v
          python -m unittest discover -s tests -p test_story_v4.py -v
      - name: Instantiate real Gradio Blocks and callbacks
        run: |
          python - <<'PY'
          from adventure_studio.studio_gradio import make_app

          app = make_app()
          assert app is not None
          assert len(app.fns) >= 10, 'Expected scene/item/puzzle editing and export handlers'
          print('Gradio Blocks and editing callbacks initialized successfully')
          PY
      - name: Start Codespaces-style Gradio server and probe HTTP
        env:
          CODESPACES: 'true'
        run: |
          bash .devcontainer/start-studio.sh
          for ATTEMPT in $(seq 1 40); do
            if curl --silent --show-error --fail http://127.0.0.1:7860/config > /dev/null 2>&1; then
              echo 'Adventure Studio Gradio HTTP endpoint is reachable'
              exit 0
            fi
            sleep 1
          done
          sed -n '1,120p' /tmp/adventure-studio/gradio.log
          exit 1
      - name: Click through authored BOXM routing in real Chrome
        env:
          ADVENTURE_STUDIO_BOXM_EVIDENCE: /tmp/studio-boxm-evidence
        run: |
          python -m pip install 'playwright>=1.55,<2'
          command -v google-chrome || command -v google-chrome-stable
          python tests/gradio_browser_boxm.py
      - name: Retain authored BOXM browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-gradio-boxm-browser
          path: |
            /tmp/studio-boxm-evidence/*.png
            /tmp/studio-boxm-evidence/*.json
          if-no-files-found: ignore
      - name: Click through two authored Z-planes in real Chrome
        env:
          ADVENTURE_STUDIO_ZPLANES_EVIDENCE: /tmp/studio-zplanes-evidence
        run: |
          python tests/gradio_browser_zplanes.py
      - name: Retain authored Z-plane browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-gradio-two-zplanes-browser
          path: |
            /tmp/studio-zplanes-evidence/*.png
            /tmp/studio-zplanes-evidence/*.json
          if-no-files-found: ignore
      - name: Click through native object-image Z-mask in real Chrome
        env:
          ADVENTURE_STUDIO_OBJECT_ZMASK_EVIDENCE: /tmp/studio-object-zmask-evidence
        run: |
          python tests/gradio_browser_object_zmask.py
      - name: Retain object-Z-mask browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-gradio-object-zmask-browser
          path: |
            /tmp/studio-object-zmask-evidence/*.png
            /tmp/studio-object-zmask-evidence/*.json
          if-no-files-found: ignore
      - name: Click through authored SCAL perspective in real Chrome
        env:
          ADVENTURE_STUDIO_SCAL_EVIDENCE: /tmp/studio-scal-evidence
        run: |
          python tests/gradio_browser_scal.py
      - name: Retain authored SCAL browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-gradio-scal-browser
          path: |
            /tmp/studio-scal-evidence/*.png
            /tmp/studio-scal-evidence/*.json
          if-no-files-found: ignore
      - name: Click through native NPC dialogue pose editing in real Chrome
        env:
          ADVENTURE_STUDIO_BROWSER_PROJECT: /tmp/studio-browser-story/project.json
          ADVENTURE_STUDIO_BROWSER_EVIDENCE: /tmp/studio-browser-evidence
        run: |
          python -m pip install 'playwright>=1.55,<2'
          command -v google-chrome || command -v google-chrome-stable
          python -m adventure_studio.dialogue_demo examples/mini_story.json /tmp/studio-browser-story --linear-multispeaker
          python -m adventure_studio.dialogue_animation_fixture /tmp/studio-browser-story --two-poses
          python tests/gradio_browser_dialogue.py
      - name: Retain browser screenshot and authored project evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-gradio-png-dialogue-browser
          path: |
            /tmp/studio-browser-evidence/*.png
            /tmp/studio-browser-evidence/*.json
            /tmp/adventure-studio/gradio.log
          if-no-files-found: ignore
