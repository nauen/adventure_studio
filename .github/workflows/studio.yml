name: Gradio Studio UI smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/studio.yml'
      - '.devcontainer/devcontainer.json'
      - '.devcontainer/start-studio.sh'
      - '.devcontainer/setup.sh'
      - '.devcontainer/install-scummc.sh'
      - 'pyproject.toml'
      - 'src/adventure_studio/studio_service.py'
      - 'src/adventure_studio/studio_export.py'
      - 'src/adventure_studio/studio_gradio.py'
      - 'tests/test_studio_service.py'
      - 'tests/test_studio_export.py'
      - 'tests/test_studio_position.py'
  pull_request:
    paths:
      - '.github/workflows/studio.yml'
      - '.devcontainer/devcontainer.json'
      - '.devcontainer/start-studio.sh'
      - '.devcontainer/setup.sh'
      - '.devcontainer/install-scummc.sh'
      - 'pyproject.toml'
      - 'src/adventure_studio/studio_service.py'
      - 'src/adventure_studio/studio_export.py'
      - 'src/adventure_studio/studio_gradio.py'
      - 'tests/test_studio_service.py'
      - 'tests/test_studio_export.py'
      - 'tests/test_studio_position.py'

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install optional UI dependencies
        run: python -m pip install -e '.[studio]'
      - name: Verify deterministic editor service
        run: |
          python -m unittest discover -s tests -p test_studio_service.py -v
          python -m unittest discover -s tests -p test_studio_export.py -v
          python -m unittest discover -s tests -p test_studio_position.py -v
      - name: Instantiate real Gradio Blocks and callbacks
        run: |
          python - <<'PY'
          from adventure_studio.studio_gradio import make_app

          app = make_app()
          assert app is not None
          assert len(app.fns) >= 10, 'Expected scene/item/puzzle editing and export handlers'
          print('Gradio Blocks and editing callbacks initialized successfully')
          PY
      - name: Start Codespaces-style Gradio server and probe HTTP
        env:
          CODESPACES: 'true'
        run: |
          bash .devcontainer/start-studio.sh
          for ATTEMPT in $(seq 1 40); do
            if curl --silent --show-error --fail http://127.0.0.1:7860/config > /dev/null 2>&1; then
              echo 'Adventure Studio Gradio HTTP endpoint is reachable'
              exit 0
            fi
            sleep 1
          done
          sed -n '1,120p' /tmp/adventure-studio/gradio.log
          exit 1
