name: Experimental SCUMM v6 compatibility probe

# Full stock-ScummVM gameplay regression is a mandatory merge gate.
# Independent mask / room geometry / actor-audio / story gameplay groups
# run on separate fresh runners and must each succeed. Experimental engine
# detection assertions remain explicitly bounded inside their steps.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  probe:
    name: Native ScummVM – ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [mask, geometry, actors, story]
    runs-on: ubuntu-24.04
    # ScummVM pulls a large data package. The Ubuntu mirror occasionally
    # stalls; give the full job enough time while bounding the install step.
    timeout-minutes: ${{ matrix.shard == 'geometry' && 180 || 75 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore previously downloaded Ubuntu packages
        uses: actions/cache/restore@v4
        with:
          path: /tmp/scumm-experimental-apt
          key: ubuntu-24.04-scumm-experimental-apt-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          restore-keys: |
            ubuntu-24.04-scumm-experimental-apt-
      - name: Install compiler dependencies and stock ScummVM
        timeout-minutes: 35
        run: |
          sudo mkdir -p /tmp/scumm-experimental-apt/partial
          bash .github/scripts/prepare-native-apt.sh
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -y --no-install-recommends -o Dir::Cache::archives=/tmp/scumm-experimental-apt -o Acquire::Retries=4 -o Acquire::http::Timeout=45 -o Acquire::https::Timeout=45 install build-essential bison flex xsltproc pkg-config libglib2.0-dev scummvm timgm6mb-soundfont xvfb xauth x11-apps xdotool imagemagick fonts-dejavu-core
      - name: Save downloaded Ubuntu packages even when install times out
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/scumm-experimental-apt
          key: ubuntu-24.04-scumm-experimental-apt-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
      - name: Fetch unmodified ScummC
        run: git clone --depth 1 https://github.com/AlbanBedel/scummc.git /tmp/scummc-upstream
      - name: Fix legacy ScummC tool help paths in ephemeral checkout
        # Upstream Makefile.target expects man/scc.xml, but the actual file is
        # man/tools/scc.xml. Keep this compatibility adjustment outside our
        # product source; fail if the expected upstream layout changes.
        working-directory: /tmp/scummc-upstream
        run: |
          test -f man/tools/scc.xml
          test -f man/tools/header.xslt
          grep -Fq '$(SRCDIR)/man/%.xml' Makefile.target
          sed -i 's@$(SRCDIR)/man/%.xml@$(SRCDIR)/man/tools/%.xml@g; s@$(SRCDIR)/man/header.xslt@$(SRCDIR)/man/tools/header.xslt@g' Makefile.target
      - name: Build ScummC tools
        working-directory: /tmp/scummc-upstream
        run: |
          ./configure
          make -j2
          find . -type f \( -name scc -o -name sld \) -print
      - name: Compile authored SCUMM v6 COST with two explicit COUNT events
        if: ${{ matrix.shard == 'actors' }}
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.scumm_costume_probe /tmp/scummc-upstream /tmp/native-costume
      - name: Retain generated native COST research evidence
        if: ${{ always() && matrix.shard == 'actors' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-v6-costume-count
          path: |
            /tmp/native-costume/native-costume-report.json
            /tmp/native-costume/NativeGesture.scost
            /tmp/native-costume/NativeGesture.cost
          if-no-files-found: ignore
      - name: Build upstream road example
        working-directory: /tmp/scummc-upstream/examples/road
        run: make
      - name: Generate Adventure Studio 640x200 room source
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.scumm_assets /tmp/generated-room
          python -m adventure_studio.scumm_bootstrap /tmp/scummc-upstream/examples/road/common.scc /tmp/generated-room/bootstrap.scc Harbor /tmp/scummc-upstream/examples/road/common.sch @/tmp/generated-room/inventory-ids.txt
      - name: Compile generated room with ScummC
        run: |
          SCC_BIN=$(find /tmp/scummc-upstream -type f -name scc -executable -print -quit)
          test -n "$SCC_BIN"
          "$SCC_BIN" -V 6 -I /tmp/scummc-upstream/include -I /tmp/generated-room -I /tmp/scummc-upstream/examples/road -R /tmp/generated-room -o /tmp/generated-room/Harbor.roobj /tmp/generated-room/Harbor.scc
          test -s /tmp/generated-room/Harbor.roobj
          "$SCC_BIN" -V 6 -I /tmp/scummc-upstream/include -I /tmp/generated-room -I /tmp/scummc-upstream/examples/road -R /tmp/generated-room -o /tmp/generated-room/Cellar.roobj /tmp/generated-room/Cellar.scc
          test -s /tmp/generated-room/Cellar.roobj
      - name: Link generated room with upstream game bootstrap
        env:
          PYTHONPATH: src
        run: |
          cp /tmp/generated-room/Inv_Key.bmp /tmp/scummc-upstream/examples/road/Inv_Key.bmp
          SCC_BIN=$(find /tmp/scummc-upstream -type f -name scc -executable -print -quit)
          SLD_BIN=$(find /tmp/scummc-upstream -type f -name sld -executable -print -quit)
          test -n "$SCC_BIN" && test -n "$SLD_BIN"
          "$SCC_BIN" -V 6 -I /tmp/scummc-upstream/include -I /tmp/generated-room -I /tmp/scummc-upstream/examples/road -R /tmp/scummc-upstream/examples/road -o /tmp/generated-room/bootstrap.roobj /tmp/generated-room/bootstrap.scc
          cd /tmp/scummc-upstream/examples/road
          "$SLD_BIN" -o /tmp/generated-room/studio /tmp/generated-room/bootstrap.roobj /tmp/generated-room/Harbor.roobj /tmp/generated-room/Cellar.roobj
          test -s /tmp/generated-room/studio.000
          test -s /tmp/generated-room/studio.001
          mkdir -p /tmp/studio-fixture
          cp /tmp/generated-room/studio.000 /tmp/generated-room/studio.001 /tmp/studio-fixture/
        # The native-room variation must be accepted by upstream ScummC and
        # its linked resource tree must contain the requested native chunks.
        # This is NOT a visual ScummVM occlusion/walking acceptance test.
        # Kept separate from the existing screenshot baseline.
      # Run the sole active R06 product-path acceptance immediately after the
      # common native ScummC bootstrap is built. Independent legacy gameplay
      # gates remain mandatory below, but cannot prevent this evidence from
      # running and uploading a failure report of its own.
      - name: Verify native transferred Actor positioning in destination room
        if: ${{ matrix.shard == 'geometry' }}
        env:
          PYTHONPATH: src
        run: |
          python -m pip install 'Pillow>=10,<13'
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_actor_zclip_transfer_probe /tmp/scummc-upstream /tmp/native-transferred-actor-position --position
      - name: Retain native transferred Actor position evidence
        if: ${{ always() && matrix.shard == 'geometry' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-transferred-actor-position
          path: /tmp/native-transferred-actor-position
          if-no-files-found: ignore
      - name: Verify Studio-authored ZP01 occlusion during native pan and return
        if: ${{ matrix.shard == 'geometry' }}
        env:
          PYTHONPATH: src
        run: |
          python -m pip install 'Pillow>=10,<13'
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_camera_zp01_probe /tmp/scummc-upstream /tmp/generated-room /tmp/native-r06-camera-zp01
      - name: Retain native R06 four-phase controls, source games and timestamps
        if: ${{ always() && matrix.shard == 'geometry' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-r06-camera-zp01
          path: |
            /tmp/native-r06-camera-zp01/native-r06-camera-zp01-report.json
            /tmp/native-r06-camera-zp01/*-project.json
            /tmp/native-r06-camera-zp01/*-zp01.png
            /tmp/native-r06-camera-zp01/*/Harbor.scc
            /tmp/native-r06-camera-zp01/*/tentacle.000
            /tmp/native-r06-camera-zp01/*/tentacle.001
            /tmp/native-r06-camera-zp01/*-screenshots/scummvm-*.png
            /tmp/native-r06-camera-zp01/*-screenshots/camera-frame-times.json
            /tmp/native-r06-camera-zp01/*-screenshots/scummvm-launch.log
          if-no-files-found: ignore
      - name: Build and launch two authored native Actors with four room Z-masks (R06 stage 1)
        if: ${{ matrix.shard == 'geometry' }}
        env:
          PYTHONPATH: src
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m unittest discover -s tests -p 'test_scumm_two_actor_four_mask_probe.py' -v
          xvfb-run -a -s '-screen 0 1024x768x24' python -u -m adventure_studio.scumm_two_actor_four_mask_probe /tmp/scummc-upstream /tmp/native-r06-two-actors-four-mask
      - name: Retain native two-Actor masked/transparent games and pixel-tracked routes
        if: ${{ always() && matrix.shard == 'geometry' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-r06-two-actors-four-mask
          path: |
            /tmp/native-r06-two-actors-four-mask/native-r06-two-actor-four-mask-report.json
            /tmp/native-r06-two-actors-four-mask/*/build/project.json
            /tmp/native-r06-two-actors-four-mask/*/game/tentacle.000
            /tmp/native-r06-two-actors-four-mask/*/game/tentacle.001
            /tmp/native-r06-two-actors-four-mask/*/screenshots/scummvm-*.png
            /tmp/native-r06-two-actors-four-mask/*/screenshots/scummvm-launch.log
            /tmp/native-r06-two-actors-four-mask/*/screenshots/r06-two-actor-walk-capture.json
          if-no-files-found: ignore
      - name: Compile and play native R06 camera handoff to second moving Actor
        if: ${{ matrix.shard == 'geometry' }}
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_scumm_two_actor_camera_handoff_probe.py' -v
          xvfb-run -a -s '-screen 0 1024x768x24' python -u -m adventure_studio.scumm_two_actor_camera_handoff_probe /tmp/scummc-upstream /tmp/native-r06-camera-handoff
      - name: Retain three genuine ScummVM camera-handoff control games and frames
        if: ${{ always() && matrix.shard == 'geometry' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-r06-two-actor-camera-handoff
          path: |
            /tmp/native-r06-camera-handoff/native-r06-camera-handoff-report.json
            /tmp/native-r06-camera-handoff/*/build/project.json
            /tmp/native-r06-camera-handoff/*/game/tentacle.000
            /tmp/native-r06-camera-handoff/*/game/tentacle.001
            /tmp/native-r06-camera-handoff/*/screenshots/scummvm-*.png
            /tmp/native-r06-camera-handoff/*/screenshots/r06-two-actor-walk-capture.json
          if-no-files-found: ignore
      - name: Prove opposite-direction native Actor movement behind four Z-masks
        if: ${{ matrix.shard == 'geometry' }}
        env:
          PYTHONPATH: src
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m unittest discover -s tests -p 'test_scumm_opposing_actor_probe.py' -v
          xvfb-run -a -s '-screen 0 1024x768x24' python -u -m adventure_studio.scumm_opposing_actor_probe /tmp/scummc-upstream /tmp/native-r06-opposing-two-actors
      - name: Retain actual opposing-Actor masked and control ScummVM gameplay frames
        if: ${{ always() && matrix.shard == 'geometry' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-r06-opposing-two-actors
          if-no-files-found: ignore
          path: |
            /tmp/native-r06-opposing-two-actors/native-r06-opposing-report.json
            /tmp/native-r06-opposing-two-actors/*/build/project.json
            /tmp/native-r06-opposing-two-actors/*/game/tentacle.000
            /tmp/native-r06-opposing-two-actors/*/game/tentacle.001
            /tmp/native-r06-opposing-two-actors/*/screenshots/scummvm-*.png
            /tmp/native-r06-opposing-two-actors/*/screenshots/scummvm-launch.log
            /tmp/native-r06-opposing-two-actors/*/screenshots/r06-two-actor-walk-capture.json
      - name: Verify R06 native focus handoff during opposite-direction Actor walks
        if: ${{ matrix.shard == 'geometry' }}
        env:
          PYTHONPATH: src
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m unittest discover -s tests -p 'test_scumm_opposing_handoff_probe.py' -v
          xvfb-run -a -s '-screen 0 1024x768x24' python -u -m adventure_studio.scumm_opposing_handoff_probe /tmp/scummc-upstream /tmp/native-r06-opposing-handoff
      - name: Retain R06 opposing-focus masked and native control games
        if: ${{ always() && matrix.shard == 'geometry' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-r06-opposing-handoff
          if-no-files-found: ignore
          path: |
            /tmp/native-r06-opposing-handoff/native-r06-opposing-handoff-report.json
            /tmp/native-r06-opposing-handoff/*/build/project.json
            /tmp/native-r06-opposing-handoff/*/game/tentacle.000
            /tmp/native-r06-opposing-handoff/*/game/tentacle.001
            /tmp/native-r06-opposing-handoff/*/screenshots/scummvm-*.png
            /tmp/native-r06-opposing-handoff/*/screenshots/scummvm-launch.log
            /tmp/native-r06-opposing-handoff/*/screenshots/r06-two-actor-walk-capture.json
      - name: Prove reciprocal A-B-A native camera focus during opposite walks
        if: ${{ matrix.shard == 'geometry' }}
        env:
          PYTHONPATH: src
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m unittest discover -s tests -p 'test_scumm_reciprocal_focus_probe.py' -v
          xvfb-run -a -s '-screen 0 1024x768x24' python -u -m adventure_studio.scumm_reciprocal_focus_probe /tmp/scummc-upstream /tmp/native-r06-reciprocal-focus
      - name: Retain reciprocal A-B-A masked and control native ScummVM gameplay
        if: ${{ always() && matrix.shard == 'geometry' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-r06-reciprocal-focus
          if-no-files-found: ignore
          path: |
            /tmp/native-r06-reciprocal-focus/native-r06-reciprocal-focus-report.json
            /tmp/native-r06-reciprocal-focus/*/build/project.json
            /tmp/native-r06-reciprocal-focus/*/game/tentacle.000
            /tmp/native-r06-reciprocal-focus/*/game/tentacle.001
            /tmp/native-r06-reciprocal-focus/*/screenshots/scummvm-*.png
            /tmp/native-r06-reciprocal-focus/*/screenshots/scummvm-launch.log
            /tmp/native-r06-reciprocal-focus/*/screenshots/r06-two-actor-walk-capture.json
      - name: Prove two native Actors walk both outbound and return Z-mask routes
        if: ${{ matrix.shard == 'geometry' }}
        env:
          PYTHONPATH: src
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m unittest discover -s tests -p 'test_scumm_return_walk_probe.py' -v
          xvfb-run -a -s '-screen 0 1024x768x24' python -u -m adventure_studio.scumm_return_walk_probe /tmp/scummc-upstream /tmp/native-r06-return-walk
      - name: Retain two-Actor return gameplay and all stock ScummVM mask controls
        if: ${{ always() && matrix.shard == 'geometry' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-r06-return-walk
          if-no-files-found: ignore
          path: |
            /tmp/native-r06-return-walk/native-r06-return-walk-report.json
            /tmp/native-r06-return-walk/*/build/project.json
            /tmp/native-r06-return-walk/*/game/tentacle.000
            /tmp/native-r06-return-walk/*/game/tentacle.001
            /tmp/native-r06-return-walk/*/screenshots/scummvm-*.png
            /tmp/native-r06-return-walk/*/screenshots/scummvm-launch.log
            /tmp/native-r06-return-walk/*/screenshots/r06-two-actor-walk-capture.json
      - name: Prove staggered native two-Actor return with one Actor temporarily stopped
        if: ${{ matrix.shard == 'geometry' }}
        env:
          PYTHONPATH: src
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m unittest discover -s tests -p 'test_scumm_staggered_return_probe.py' -v
          xvfb-run -a -s '-screen 0 1024x768x24' python -u -m adventure_studio.scumm_staggered_return_probe /tmp/scummc-upstream /tmp/native-r06-staggered-return
      - name: Retain staggered Actor return game and native positive-negative controls
        if: ${{ always() && matrix.shard == 'geometry' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-r06-staggered-return
          if-no-files-found: ignore
          path: |
            /tmp/native-r06-staggered-return/native-r06-staggered-return-report.json
            /tmp/native-r06-staggered-return/*/build/project.json
            /tmp/native-r06-staggered-return/*/game/tentacle.000
            /tmp/native-r06-staggered-return/*/game/tentacle.001
            /tmp/native-r06-staggered-return/*/screenshots/scummvm-*.png
            /tmp/native-r06-staggered-return/*/screenshots/scummvm-launch.log
            /tmp/native-r06-staggered-return/*/screenshots/r06-two-actor-walk-capture.json
      - name: Prove native two-Actor rendezvous at common X and separate return routes
        if: ${{ matrix.shard == 'geometry' }}
        env:
          PYTHONPATH: src
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m unittest discover -s tests -p 'test_scumm_rendezvous_probe.py' -v
          xvfb-run -a -s '-screen 0 1024x768x24' python -u -m adventure_studio.scumm_rendezvous_probe /tmp/scummc-upstream /tmp/native-r06-rendezvous
      - name: Retain rendezvous native ScummVM games and all mask controls
        if: ${{ always() && matrix.shard == 'geometry' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-r06-rendezvous
          if-no-files-found: ignore
          path: |
            /tmp/native-r06-rendezvous/native-r06-rendezvous-report.json
            /tmp/native-r06-rendezvous/*/build/project.json
            /tmp/native-r06-rendezvous/*/game/tentacle.000
            /tmp/native-r06-rendezvous/*/game/tentacle.001
            /tmp/native-r06-rendezvous/*/screenshots/scummvm-*.png
            /tmp/native-r06-rendezvous/*/screenshots/scummvm-launch.log
            /tmp/native-r06-rendezvous/*/screenshots/r06-two-actor-walk-capture.json
      - name: Prove native rendezvous stillness and A-first B-second Actor release
        if: ${{ matrix.shard == 'geometry' }}
        env:
          PYTHONPATH: src
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m unittest discover -s tests -p 'test_scumm_meeting_release_probe.py' -v
          xvfb-run -a -s '-screen 0 1024x768x24' python -u -m adventure_studio.scumm_meeting_release_probe /tmp/scummc-upstream /tmp/native-r06-meeting-release
      - name: Retain native meeting and delayed release masked and control games
        if: ${{ always() && matrix.shard == 'geometry' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-r06-meeting-release
          if-no-files-found: ignore
          path: |
            /tmp/native-r06-meeting-release/native-r06-meeting-release-report.json
            /tmp/native-r06-meeting-release/*/build/project.json
            /tmp/native-r06-meeting-release/*/game/tentacle.000
            /tmp/native-r06-meeting-release/*/game/tentacle.001
            /tmp/native-r06-meeting-release/*/screenshots/scummvm-*.png
            /tmp/native-r06-meeting-release/*/screenshots/scummvm-launch.log
            /tmp/native-r06-meeting-release/*/screenshots/r06-two-actor-walk-capture.json
      - name: Prove native camera inspection panorama while two Actors wait at meeting
        if: ${{ matrix.shard == 'geometry' }}
        env:
          PYTHONPATH: src
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m unittest discover -s tests -p 'test_scumm_meeting_camera_probe.py' -v
          xvfb-run -a -s '-screen 0 1024x768x24' python -u -m adventure_studio.scumm_meeting_camera_probe /tmp/scummc-upstream /tmp/native-r06-meeting-camera
      - name: Retain native meeting camera tour and ScummVM controls
        if: ${{ always() && matrix.shard == 'geometry' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-r06-meeting-camera
          if-no-files-found: ignore
          path: |
            /tmp/native-r06-meeting-camera/native-r06-meeting-camera-report.json
            /tmp/native-r06-meeting-camera/*/build/project.json
            /tmp/native-r06-meeting-camera/*/game/tentacle.000
            /tmp/native-r06-meeting-camera/*/game/tentacle.001
            /tmp/native-r06-meeting-camera/*/screenshots/scummvm-*.png
            /tmp/native-r06-meeting-camera/*/screenshots/scummvm-launch.log
            /tmp/native-r06-meeting-camera/*/screenshots/r06-two-actor-walk-capture.json
      - name: Prove native Actor B camera follow resumes after scripted meeting inspection
        if: ${{ matrix.shard == 'geometry' }}
        env:
          PYTHONPATH: src
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m unittest discover -s tests -p 'test_scumm_camera_resume_probe.py' -v
          xvfb-run -a -s '-screen 0 1024x768x24' python -u -m adventure_studio.scumm_camera_resume_probe /tmp/scummc-upstream /tmp/native-r06-camera-resume
      - name: Retain native camera reacquisition ScummVM gameplay and mask controls
        if: ${{ always() && matrix.shard == 'geometry' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-r06-camera-resume
          if-no-files-found: ignore
          path: |
            /tmp/native-r06-camera-resume/native-r06-camera-resume-report.json
            /tmp/native-r06-camera-resume/*/build/project.json
            /tmp/native-r06-camera-resume/*/game/tentacle.000
            /tmp/native-r06-camera-resume/*/game/tentacle.001
            /tmp/native-r06-camera-resume/*/screenshots/scummvm-*.png
            /tmp/native-r06-camera-resume/*/screenshots/scummvm-launch.log
            /tmp/native-r06-camera-resume/*/screenshots/r06-two-actor-walk-capture.json
      - name: Prove stock ScummVM Actor B mid-walk destination retarget without wait
        if: ${{ matrix.shard == 'geometry' }}
        env:
          PYTHONPATH: src
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m unittest discover -s tests -p 'test_scumm_retarget_walk_probe.py' -v
          xvfb-run -a -s '-screen 0 1024x768x24' python -u -m adventure_studio.scumm_retarget_walk_probe /tmp/scummc-upstream /tmp/native-r06-retarget-walk
      - name: Retain native mid-walk retarget games and mask-control screenshots
        if: ${{ always() && matrix.shard == 'geometry' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-r06-retarget-walk
          if-no-files-found: ignore
          path: |
            /tmp/native-r06-retarget-walk/native-r06-retarget-report.json
            /tmp/native-r06-retarget-walk/*/build/project.json
            /tmp/native-r06-retarget-walk/*/game/tentacle.000
            /tmp/native-r06-retarget-walk/*/game/tentacle.001
            /tmp/native-r06-retarget-walk/*/screenshots/scummvm-*.png
