name: Experimental SCUMM v6 compatibility probe

# Experimental: upstream ScummC's detection in stock ScummVM is unproven.
# Run for probe changes only; a red run is research, not a release regression.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/scummc-experiment.yml'
      - 'src/adventure_studio/scumm_assets.py'
      - 'src/adventure_studio/scumm_bootstrap.py'
      - 'src/adventure_studio/scumm_probe.py'
      - 'src/adventure_studio/scumm_launch.py'
      - 'tests/test_scumm_assets.py'
      - 'tests/test_scumm_bootstrap.py'
      - 'tests/test_scumm_probe.py'
      - 'tests/test_scumm_launch.py'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compiler dependencies and stock ScummVM
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex xsltproc pkg-config libglib2.0-dev scummvm xvfb xauth x11-apps imagemagick
      - name: Fetch unmodified ScummC
        run: git clone --depth 1 https://github.com/AlbanBedel/scummc.git /tmp/scummc-upstream
      - name: Fix legacy ScummC tool help paths in ephemeral checkout
        # Upstream Makefile.target expects man/scc.xml, but the actual file is
        # man/tools/scc.xml. Keep this compatibility adjustment outside our
        # product source; fail if the expected upstream layout changes.
        working-directory: /tmp/scummc-upstream
        run: |
          test -f man/tools/scc.xml
          test -f man/tools/header.xslt
          grep -Fq '$(SRCDIR)/man/%.xml' Makefile.target
          sed -i 's@$(SRCDIR)/man/%.xml@$(SRCDIR)/man/tools/%.xml@g; s@$(SRCDIR)/man/header.xslt@$(SRCDIR)/man/tools/header.xslt@g' Makefile.target
      - name: Build ScummC tools
        working-directory: /tmp/scummc-upstream
        run: |
          ./configure
          make -j2
          find . -type f \( -name scc -o -name sld \) -print
      - name: Build upstream road example
        working-directory: /tmp/scummc-upstream/examples/road
        run: make
      - name: Generate Adventure Studio 640x200 room source
        env:
          PYTHONPATH: src
        run: python -m adventure_studio.scumm_assets /tmp/generated-room
      - name: Compile generated room with ScummC
        run: |
          SCC_BIN=$(find /tmp/scummc-upstream -type f -name scc -executable -print -quit)
          test -n "$SCC_BIN"
          "$SCC_BIN" -V 6 -I /tmp/scummc-upstream/include -I /tmp/scummc-upstream/examples/road -R /tmp/generated-room -o /tmp/generated-room/Harbor.roobj /tmp/generated-room/Harbor.scc
          test -s /tmp/generated-room/Harbor.roobj
      - name: Link generated room with upstream game bootstrap
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.scumm_bootstrap /tmp/scummc-upstream/examples/road/common.scc /tmp/generated-room/bootstrap.scc Harbor
          SCC_BIN=$(find /tmp/scummc-upstream -type f -name scc -executable -print -quit)
          SLD_BIN=$(find /tmp/scummc-upstream -type f -name sld -executable -print -quit)
          test -n "$SCC_BIN" && test -n "$SLD_BIN"
          "$SCC_BIN" -V 6 -I /tmp/scummc-upstream/include -I /tmp/scummc-upstream/examples/road -R /tmp/scummc-upstream/examples/road -o /tmp/generated-room/bootstrap.roobj /tmp/generated-room/bootstrap.scc
          cd /tmp/scummc-upstream/examples/road
          "$SLD_BIN" -o /tmp/generated-room/studio /tmp/generated-room/bootstrap.roobj /tmp/generated-room/Harbor.roobj
          test -s /tmp/generated-room/studio.000
          test -s /tmp/generated-room/studio.001
          mkdir -p /tmp/studio-fixture
          cp /tmp/generated-room/studio.000 /tmp/generated-room/studio.001 /tmp/studio-fixture/
      - name: Produce ScummC documented compatibility-only detection fixture
        # Research fixture only: this uses the Day of the Tentacle game ID
        # described by ScummC upstream. Never label it as native game support.
        run: |
          SLD_BIN=$(find /tmp/scummc-upstream -type f -name sld -executable -print -quit)
          "$SLD_BIN" -o /tmp/generated-room/tentacle -key 0x69 /tmp/generated-room/bootstrap.roobj /tmp/generated-room/Harbor.roobj
          mkdir -p /tmp/tentacle-fixture
          cp /tmp/generated-room/tentacle.000 /tmp/generated-room/tentacle.001 /tmp/tentacle-fixture/
      - name: Rebuild the complete upstream demo using our generated background
        # This preserves upstream game logic and changes only the room art. It
        # tests image integration/linking, not our future game-script exporter.
        working-directory: /tmp/scummc-upstream/examples/road
        run: |
          cp /tmp/generated-room/Harbor.bmp road.bmp
          make clean
          make
          test -s scummc6.000
          test -s scummc6.001
      - name: Verify linked SCUMM data pair
        env:
          PYTHONPATH: src
        run: |
          python -c 'from pathlib import Path; from adventure_studio.scumm_probe import check_game_files; result = check_game_files(Path("/tmp/studio-fixture")); print(result); assert result[0]'
      - name: Probe stock ScummVM detection (experimental, expected incompatibility possible)
        # A custom SCUMM v6 game is not guaranteed to appear in an unmodified
        # ScummVM detection table. Record this independently from compilation.
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.scumm_probe /tmp/studio-fixture
      - name: Probe upstream SCUMM game detection (experimental)
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.scumm_probe /tmp/scummc-upstream/examples/road
      - name: Probe documented compatibility fixture (not production support)
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.scumm_probe /tmp/tentacle-fixture
      - name: Launch compatibility fixture in virtual X display (experimental)
        # This is an actual ScummVM process smoke test, not a gameplay test.
        # Failures should be visible without masking compilation or detection.
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_launch /tmp/tentacle-fixture /tmp/scummvm-smoke
      - name: Publish visual probe summary
        if: always()
        run: |
          {
            echo '## SCUMM-v6 graphics probe'
            echo
            echo 'The gameplay fixture uses a temporary Day of the Tentacle compatibility identity, **not** native ScummVM game detection.'
            echo
            if test -f /tmp/scummvm-smoke/scummvm-frame-report.json; then
              python -c 'import json; p=json.load(open("/tmp/scummvm-smoke/scummvm-frame-report.json")); print("- Changed pixels: **{}** (minimum: {})".format(p["changed_pixels"],p["minimum_changed_pixels"])); print("- Frame variation: **{}**".format("PASS" if p["frame_variation_passed"] else "FAIL")); print("- Camera scrolling: **not yet proven**")'
              echo '- Start/end screenshots and diff are in the `scummc-research-output` artifact.'
            else
              echo '- Visual comparison: **not produced** (see workflow steps and logs).'
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compiler outputs for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scummc-research-output
          if-no-files-found: ignore
          path: |
            /tmp/generated-room/Harbor.scc
            /tmp/generated-room/Harbor.roobj
            /tmp/generated-room/Harbor.bmp
            /tmp/generated-room/studio.000
            /tmp/generated-room/studio.001
            /tmp/studio-fixture/*.000
            /tmp/studio-fixture/*.001
            /tmp/tentacle-fixture/*.000
            /tmp/tentacle-fixture/*.001
            /tmp/scummvm-smoke/*
            /tmp/scummc-upstream/examples/road/*.000
            /tmp/scummc-upstream/examples/road/*.001
            /tmp/scummc-upstream/examples/road/*.sou
