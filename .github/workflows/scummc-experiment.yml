name: Experimental SCUMM v6 compatibility probe

# Experimental: upstream ScummC's detection in stock ScummVM is unproven.
# Run for probe changes only; a red run is research, not a release regression.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/scummc-experiment.yml'
      - 'src/adventure_studio/scumm_assets.py'
      - 'src/adventure_studio/scumm_binary.py'
      - 'src/adventure_studio/scumm_room_fixture.py'
      - 'src/adventure_studio/scumm_room_visual_probe.py'
      - 'src/adventure_studio/scumm_scal_probe.py'
      - 'src/adventure_studio/scumm_camera_probe.py'
      - 'src/adventure_studio/scumm_costume.py'
      - 'src/adventure_studio/scumm_costume_probe.py'
      - 'src/adventure_studio/palette_animation.py'
      - 'src/adventure_studio/palette_demo.py'
      - 'src/adventure_studio/scumm_palette_probe.py'
      - 'src/adventure_studio/scumm_bootstrap.py'
      - 'src/adventure_studio/scumm_probe.py'
      - 'src/adventure_studio/scumm_launch.py'
      - 'src/adventure_studio/scumm_project.py'
      - 'src/adventure_studio/scumm_toolchain.py'
      - 'src/adventure_studio/story_document.py'
      - 'src/adventure_studio/story_to_scumm.py'
      - 'src/adventure_studio/dialogue_demo.py'
      - 'tests/test_story_v4.py'
      - 'src/adventure_studio/music_demo.py'
      - 'src/adventure_studio/music_transition_demo.py'
      - 'src/adventure_studio/music_director.py'
      - 'src/adventure_studio/scumm_audio_probe.py'
      - 'examples/mini_story.json'
      - 'examples/mini_story_two_items.json'
      - 'examples/mini_story_three_items.json'
      - 'examples/mini_story_chain.json'
      - 'examples/recipe_story.json'
      - 'examples/PLAY_STORY_PREVIEW.txt'
      - 'examples/PLAY_MUSIC_TRANSITION.txt'
      - 'tests/test_scumm_assets.py'
      - 'tests/test_scumm_binary.py'
      - 'tests/test_scumm_room_primitives.py'
      - 'tests/test_scumm_scal_probe.py'
      - 'tests/test_scumm_camera_cues.py'
      - 'tests/test_scumm_costume.py'
      - 'tests/test_palette_animation.py'
      - 'tests/test_palette_demo.py'
      - 'tests/test_scumm_palette_probe.py'
      - 'tests/test_scumm_bootstrap.py'
      - 'tests/test_scumm_probe.py'
      - 'tests/test_scumm_launch.py'
      - 'tests/test_story_document.py'
      - 'tests/test_story_to_scumm.py'
      - 'tests/test_scumm_toolchain.py'
      - 'tests/test_music_demo.py'
      - 'tests/test_music_transition_demo.py'
      - 'tests/test_music_director.py'
      - 'tests/test_scumm_audio_probe.py'

jobs:
  probe:
    runs-on: ubuntu-24.04
    # ScummVM pulls a large data package. The Ubuntu mirror occasionally
    # stalls; give the full job enough time while bounding the install step.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore previously downloaded Ubuntu packages
        uses: actions/cache/restore@v4
        with:
          path: /tmp/scumm-experimental-apt
          key: ubuntu-24.04-scumm-experimental-apt-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ubuntu-24.04-scumm-experimental-apt-
      - name: Install compiler dependencies and stock ScummVM
        timeout-minutes: 35
        run: |
          sudo mkdir -p /tmp/scumm-experimental-apt/partial
          sudo apt-get -o Acquire::Retries=4 -o Acquire::http::Timeout=45 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -y --no-install-recommends -o Dir::Cache::archives=/tmp/scumm-experimental-apt -o Acquire::Retries=4 -o Acquire::http::Timeout=45 install build-essential bison flex xsltproc pkg-config libglib2.0-dev scummvm timgm6mb-soundfont xvfb xauth x11-apps xdotool imagemagick
      - name: Save downloaded Ubuntu packages even when install times out
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/scumm-experimental-apt
          key: ubuntu-24.04-scumm-experimental-apt-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Fetch unmodified ScummC
        run: git clone --depth 1 https://github.com/AlbanBedel/scummc.git /tmp/scummc-upstream
      - name: Fix legacy ScummC tool help paths in ephemeral checkout
        # Upstream Makefile.target expects man/scc.xml, but the actual file is
        # man/tools/scc.xml. Keep this compatibility adjustment outside our
        # product source; fail if the expected upstream layout changes.
        working-directory: /tmp/scummc-upstream
        run: |
          test -f man/tools/scc.xml
          test -f man/tools/header.xslt
          grep -Fq '$(SRCDIR)/man/%.xml' Makefile.target
          sed -i 's@$(SRCDIR)/man/%.xml@$(SRCDIR)/man/tools/%.xml@g; s@$(SRCDIR)/man/header.xslt@$(SRCDIR)/man/tools/header.xslt@g' Makefile.target
      - name: Build ScummC tools
        working-directory: /tmp/scummc-upstream
        run: |
          ./configure
          make -j2
          find . -type f \( -name scc -o -name sld \) -print
      - name: Compile authored SCUMM v6 COST with two explicit COUNT events
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.scumm_costume_probe /tmp/scummc-upstream /tmp/native-costume
      - name: Retain generated native COST research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-v6-costume-count
          path: |
            /tmp/native-costume/native-costume-report.json
            /tmp/native-costume/NativeGesture.scost
            /tmp/native-costume/NativeGesture.cost
          if-no-files-found: ignore
      - name: Build upstream road example
        working-directory: /tmp/scummc-upstream/examples/road
        run: make
      - name: Generate Adventure Studio 640x200 room source
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.scumm_assets /tmp/generated-room
          python -m adventure_studio.scumm_bootstrap /tmp/scummc-upstream/examples/road/common.scc /tmp/generated-room/bootstrap.scc Harbor /tmp/scummc-upstream/examples/road/common.sch @/tmp/generated-room/inventory-ids.txt
      - name: Compile generated room with ScummC
        run: |
          SCC_BIN=$(find /tmp/scummc-upstream -type f -name scc -executable -print -quit)
          test -n "$SCC_BIN"
          "$SCC_BIN" -V 6 -I /tmp/scummc-upstream/include -I /tmp/generated-room -I /tmp/scummc-upstream/examples/road -R /tmp/generated-room -o /tmp/generated-room/Harbor.roobj /tmp/generated-room/Harbor.scc
          test -s /tmp/generated-room/Harbor.roobj
          "$SCC_BIN" -V 6 -I /tmp/scummc-upstream/include -I /tmp/generated-room -I /tmp/scummc-upstream/examples/road -R /tmp/generated-room -o /tmp/generated-room/Cellar.roobj /tmp/generated-room/Cellar.scc
          test -s /tmp/generated-room/Cellar.roobj
      - name: Link generated room with upstream game bootstrap
        env:
          PYTHONPATH: src
        run: |
          cp /tmp/generated-room/Inv_Key.bmp /tmp/scummc-upstream/examples/road/Inv_Key.bmp
          SCC_BIN=$(find /tmp/scummc-upstream -type f -name scc -executable -print -quit)
          SLD_BIN=$(find /tmp/scummc-upstream -type f -name sld -executable -print -quit)
          test -n "$SCC_BIN" && test -n "$SLD_BIN"
          "$SCC_BIN" -V 6 -I /tmp/scummc-upstream/include -I /tmp/generated-room -I /tmp/scummc-upstream/examples/road -R /tmp/scummc-upstream/examples/road -o /tmp/generated-room/bootstrap.roobj /tmp/generated-room/bootstrap.scc
          cd /tmp/scummc-upstream/examples/road
          "$SLD_BIN" -o /tmp/generated-room/studio /tmp/generated-room/bootstrap.roobj /tmp/generated-room/Harbor.roobj /tmp/generated-room/Cellar.roobj
          test -s /tmp/generated-room/studio.000
          test -s /tmp/generated-room/studio.001
          mkdir -p /tmp/studio-fixture
          cp /tmp/generated-room/studio.000 /tmp/generated-room/studio.001 /tmp/studio-fixture/
        # The native-room variation must be accepted by upstream ScummC and
        # its linked resource tree must contain the requested native chunks.
        # This is NOT a visual ScummVM occlusion/walking acceptance test.
        # Kept separate from the existing screenshot baseline.
      - name: Link Studio COST actor and render in stock ScummVM
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_costume_probe /tmp/scummc-upstream /tmp/generated-room /tmp/native-costume-playback
      - name: Retain native Costume gameplay frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-v6-costume-playback
          path: |
            /tmp/native-costume-playback/native-costume-report.json
            /tmp/native-costume-playback/screenshots/scummvm-end.png
            /tmp/native-costume-playback/screenshots/scummvm-frame-report.json
          if-no-files-found: ignore
      - name: Verify two native COUNT events unlock object-state change
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_costume_probe --count /tmp/scummc-upstream /tmp/generated-room /tmp/native-costume-count-gameplay
      - name: Retain native Costume COUNT event evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-v6-costume-count-gameplay
          path: |
            /tmp/native-costume-count-gameplay/native-count-gameplay-report.json
            /tmp/native-costume-count-gameplay/Harbor.scc
            /tmp/native-costume-count-gameplay/screenshots/scummvm-end.png
            /tmp/native-costume-count-gameplay/three_count_control/Harbor.scc
            /tmp/native-costume-count-gameplay/three_count_control/screenshots/scummvm-end.png
          if-no-files-found: ignore
      - name: Compile and structurally verify generated Z-plane/BOXM/SCAL room
        env:
          PYTHONPATH: src:tests
        run: |
          python -c 'from pathlib import Path; from adventure_studio.scumm_room_fixture import native_room; from adventure_studio.scumm_assets import write_room_sources; write_room_sources(native_room(), Path("/tmp/native-check"))'
          SCC_BIN=$(find /tmp/scummc-upstream -type f -name scc -executable -print -quit)
          SLD_BIN=$(find /tmp/scummc-upstream -type f -name sld -executable -print -quit)
          "$SCC_BIN" -V 6 -I /tmp/scummc-upstream/include -I /tmp/generated-room -I /tmp/scummc-upstream/examples/road -R /tmp/native-check -o /tmp/native-check/Harbor.roobj /tmp/native-check/Harbor.scc
          cd /tmp/scummc-upstream/examples/road
          "$SLD_BIN" -o /tmp/native-check/tentacle -key 0x69 /tmp/generated-room/bootstrap.roobj /tmp/native-check/Harbor.roobj /tmp/generated-room/Cellar.roobj
          cd "$GITHUB_WORKSPACE"
          python -c 'from pathlib import Path; from adventure_studio.scumm_binary import verify_room_binary; binary=Path("/tmp/native-check/tentacle.001").read_bytes(); tree=verify_room_binary(binary,xor_key=0x69); rooms=[c for level in tree for group in level.children if group.tag=="LFLF" for c in group.children if c.tag=="ROOM"]; assert any(any(i.tag=="ZP01" for rmim in r.find("RMIM") for frame in rmim.find("IM00") for i in frame.children) and all(r.find(t) for t in ("BOXD","BOXM","SCAL")) for r in rooms), "native ZP01/BOXD/BOXM/SCAL chunks missing"; print("Native SCUMM v6 room resource chunks verified")'
      - name: Run native Z-plane and walkbox scene in stock ScummVM
        env:
          PYTHONPATH: src
        run: |
          cp /tmp/generated-room/game-goal.json /tmp/native-check/game-goal.json
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_launch /tmp/native-check /tmp/native-room-smoke --scene-only
      - name: Retain native room screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-room-scummvm-screenshots
          path: |
            /tmp/native-room-smoke/scummvm-start.png
            /tmp/native-room-smoke/scummvm-end.png
            /tmp/native-room-smoke/scummvm-frame-report.json
            /tmp/native-room-smoke/scummvm-launch.log
          if-no-files-found: ignore
      - name: Compare native mask and scaling variants in stock ScummVM
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_room_visual_probe /tmp/scummc-upstream /tmp/generated-room /tmp/native-visual-comparison
      - name: Retain native mask and scaling comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-room-comparison
          path: |
            /tmp/native-visual-comparison/native-room-visual-comparison.json
            /tmp/native-visual-comparison/*-screenshots/scummvm-end.png
            /tmp/native-visual-comparison/*-screenshots/scummvm-frame-report.json
          if-no-files-found: ignore
      - name: Measure native SCAL perspective curve at three walking depths
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_scal_probe /tmp/scummc-upstream /tmp/generated-room /tmp/native-scal-perspective
      - name: Retain perspective SCAL comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-scal-perspective
          path: |
            /tmp/native-scal-perspective/native-scal-perspective-report.json
            /tmp/native-scal-perspective/*-screenshots/scummvm-end.png
            /tmp/native-scal-perspective/*-screenshots/scummvm-frame-report.json
          if-no-files-found: ignore
      - name: Verify native SCUMM v6 horizontal camera pan in stock ScummVM
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_camera_probe /tmp/scummc-upstream /tmp/generated-room /tmp/native-camera-pan
      - name: Retain native camera composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-camera-pan
          path: |
            /tmp/native-camera-pan/native-camera-pan-report.json
            /tmp/native-camera-pan/*-screenshots/scummvm-end.png
          if-no-files-found: ignore
      - name: Produce ScummC documented compatibility-only detection fixture
        # Research fixture only: this uses the Day of the Tentacle game ID
        # described by ScummC upstream. Never label it as native game support.
        run: |
          SLD_BIN=$(find /tmp/scummc-upstream -type f -name sld -executable -print -quit)
          "$SLD_BIN" -o /tmp/generated-room/tentacle -key 0x69 /tmp/generated-room/bootstrap.roobj /tmp/generated-room/Harbor.roobj /tmp/generated-room/Cellar.roobj
          mkdir -p /tmp/tentacle-fixture
          cp /tmp/generated-room/tentacle.000 /tmp/generated-room/tentacle.001 /tmp/tentacle-fixture/
          cp /tmp/generated-room/game-goal.json /tmp/tentacle-fixture/
      - name: Rebuild the complete upstream demo using our generated background
        # This preserves upstream game logic and changes only the room art. It
        # tests image integration/linking, not our future game-script exporter.
        working-directory: /tmp/scummc-upstream/examples/road
        run: |
          cp /tmp/generated-room/Harbor.bmp road.bmp
          make clean
          make
          test -s scummc6.000
          test -s scummc6.001
      - name: Verify linked SCUMM data pair
        env:
          PYTHONPATH: src
        run: |
          python -c 'from pathlib import Path; from adventure_studio.scumm_probe import check_game_files; result = check_game_files(Path("/tmp/studio-fixture")); print(result); assert result[0]'
      - name: Probe stock ScummVM detection (experimental, expected incompatibility possible)
        # A custom SCUMM v6 game is not guaranteed to appear in an unmodified
        # ScummVM detection table. Record this independently from compilation.
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.scumm_probe /tmp/studio-fixture
      - name: Probe upstream SCUMM game detection (experimental)
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.scumm_probe /tmp/scummc-upstream/examples/road
      - name: Probe documented compatibility fixture (not production support)
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.scumm_probe /tmp/tentacle-fixture
      - name: Launch compatibility fixture in virtual X display (experimental)
        # This is an actual ScummVM process smoke test, not a gameplay test.
        # A failed visual gate must make this research workflow red; GitHub's
        # step conclusion otherwise reports "success" due to continue-on-error.
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_launch /tmp/tentacle-fixture /tmp/scummvm-smoke
      - name: Compile independent adventure directly from story JSON
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.story_document examples/mini_story.json /tmp/story-build
          python -m adventure_studio.scumm_toolchain /tmp/story-build /tmp/scummc-upstream /tmp/story-fixture
          cp "$GITHUB_WORKSPACE/examples/PLAY_STORY_PREVIEW.txt" /tmp/story-fixture/README.txt
          test -s /tmp/story-fixture/tentacle.000
          test -s /tmp/story-fixture/tentacle.001
      - name: Compile experimental linear SCUMM v6 dialogue fixture
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.dialogue_demo examples/mini_story.json /tmp/dialogue-story-build
          python -m adventure_studio.scumm_toolchain /tmp/dialogue-story-build /tmp/scummc-upstream /tmp/dialogue-fixture
          cp /tmp/dialogue-story-build/story.json /tmp/dialogue-fixture/story.json
          test -s /tmp/dialogue-fixture/tentacle.000
          test -s /tmp/dialogue-fixture/tentacle.001
      - name: Compile experimental clickable-answer dialogue fixture
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.dialogue_demo examples/mini_story.json /tmp/dialogue-choices-build --choices
          python -m adventure_studio.scumm_toolchain /tmp/dialogue-choices-build /tmp/scummc-upstream /tmp/dialogue-choices-fixture
          cp /tmp/dialogue-choices-build/story.json /tmp/dialogue-choices-fixture/story.json
          test -s /tmp/dialogue-choices-fixture/tentacle.000
          test -s /tmp/dialogue-choices-fixture/tentacle.001
      # Independent media gates run before the longer gameplay interaction suite.
      # A flaky UI click in a puzzle must not prevent palette/audio evidence.
      - name: Compile indexed-water SCUMM v6 palette-cycle fixture
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.palette_demo examples/mini_story.json /tmp/palette-story-build
          python -m adventure_studio.scumm_toolchain /tmp/palette-story-build /tmp/scummc-upstream /tmp/palette-fixture
          test -s /tmp/palette-story-build/resources/Harbor.roobj
          test -s /tmp/palette-fixture/tentacle.000
          test -s /tmp/palette-fixture/tentacle.001
      - name: Verify real palette animation and unaffected sky in stock ScummVM
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_palette_probe /tmp/palette-fixture /tmp/palette-smoke
      - name: Generate original MIDI and wrap as a ScummC GMD sound resource
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.music_demo examples/mini_story.json /tmp/music-story-build
          SOUN_BIN=$(find /tmp/scummc-upstream -type f -name soun -executable -print -quit)
          test -n "$SOUN_BIN"
          "$SOUN_BIN" -gmd /tmp/music-story-build/resources/HarborTheme.mid -o /tmp/music-story-build/resources/HarborTheme.soun
          test -s /tmp/music-story-build/resources/HarborTheme.soun
          python -m adventure_studio.scumm_toolchain /tmp/music-story-build /tmp/scummc-upstream /tmp/music-fixture
          test -s /tmp/music-fixture/tentacle.000
          test -s /tmp/music-fixture/tentacle.001
      - name: Experimental PCM capture from stock ScummVM
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_audio_probe /tmp/music-fixture /tmp/music-smoke /tmp/story-fixture
      - name: Compile two distinct MIDI themes for a room-entry music transition
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.music_transition_demo examples/mini_story_chain.json /tmp/music-transition-build
          SOUN_BIN=$(find /tmp/scummc-upstream -type f -name soun -executable -print -quit)
          test -n "$SOUN_BIN"
          for TRACK in HarborTheme CellarTheme; do
            "$SOUN_BIN" -gmd "/tmp/music-transition-build/resources/${TRACK}.mid" -o "/tmp/music-transition-build/resources/${TRACK}.soun"
            test -s "/tmp/music-transition-build/resources/${TRACK}.soun"
          done
          python -m adventure_studio.scumm_toolchain /tmp/music-transition-build /tmp/scummc-upstream /tmp/music-transition-fixture
          cp examples/PLAY_MUSIC_TRANSITION.txt /tmp/music-transition-fixture/README.txt
          test -s /tmp/music-transition-fixture/tentacle.000
          test -s /tmp/music-transition-fixture/tentacle.001
      - name: Play music-transition adventure through both rooms in ScummVM
        env:
          PYTHONPATH: src
        run: |
          # This scene intentionally holds the camera still so the palette
          # animation can be observed. Gameplay gates still run in full;
          # palette changes have their own strict pixel-level probe below.
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_launch /tmp/music-transition-fixture /tmp/music-transition-smoke --static-chain-only
      - name: Verify palette cycling in the same playable two-theme adventure
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_palette_probe /tmp/music-transition-fixture /tmp/music-transition-palette-smoke
      - name: Launch story-built adventure in stock ScummVM
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_launch /tmp/story-fixture /tmp/story-smoke --puzzle-only
      - name: Compile two-item inventory puzzle from independent story JSON
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.story_document examples/mini_story_two_items.json /tmp/two-item-story-build
          python -m adventure_studio.scumm_toolchain /tmp/two-item-story-build /tmp/scummc-upstream /tmp/two-item-fixture
          cp examples/PLAY_STORY_PREVIEW.txt /tmp/two-item-fixture/README.txt
          test -s /tmp/two-item-fixture/tentacle.000
          test -s /tmp/two-item-fixture/tentacle.001
      - name: Reject premature unlock then solve two-item puzzle in stock ScummVM
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_launch /tmp/two-item-fixture /tmp/two-item-smoke --puzzle-only
      - name: Compile three-item inventory puzzle from story JSON
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.story_document examples/mini_story_three_items.json /tmp/three-item-story-build
          python -m adventure_studio.scumm_toolchain /tmp/three-item-story-build /tmp/scummc-upstream /tmp/three-item-fixture
          cp examples/PLAY_STORY_PREVIEW.txt /tmp/three-item-fixture/README.txt
          test -s /tmp/three-item-fixture/tentacle.000
          test -s /tmp/three-item-fixture/tentacle.001
      - name: Reject two incomplete inventories then solve three-item puzzle in stock ScummVM
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_launch /tmp/three-item-fixture /tmp/three-item-smoke --puzzle-only
      - name: Compile chained two-puzzle three-room adventure from story JSON
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.story_document examples/mini_story_chain.json /tmp/chain-story-build
          python -m adventure_studio.scumm_toolchain /tmp/chain-story-build /tmp/scummc-upstream /tmp/chain-fixture
          test -s /tmp/chain-story-build/resources/Archive.roobj
          test -s /tmp/chain-fixture/tentacle.000
          test -s /tmp/chain-fixture/tentacle.001
      - name: Play both doors and reach final room of chained adventure in stock ScummVM
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_launch /tmp/chain-fixture /tmp/chain-smoke --chain-only
      - name: Compile v2 recipe story and its inventory combination
        env:
          PYTHONPATH: src
        run: |
          python -m adventure_studio.story_document examples/recipe_story.json /tmp/recipe-story-build
          python -m adventure_studio.scumm_toolchain /tmp/recipe-story-build /tmp/scummc-upstream /tmp/recipe-fixture
          cp examples/PLAY_STORY_PREVIEW.txt /tmp/recipe-fixture/README.txt
          test -s /tmp/recipe-fixture/tentacle.000
          test -s /tmp/recipe-fixture/tentacle.001
      - name: Combine inventory items and unlock door in stock ScummVM
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_launch /tmp/recipe-fixture /tmp/recipe-smoke --recipe-only
      - name: Combine same inventory items in reverse order in stock ScummVM
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' python -m adventure_studio.scumm_launch /tmp/recipe-fixture /tmp/recipe-reverse-smoke --recipe-reverse-only
      - name: Publish visual probe summary
        if: always()
        run: |
          {
            echo '## SCUMM-v6 graphics probe'
            echo
            echo 'The gameplay fixture uses a temporary Day of the Tentacle compatibility identity, **not** native ScummVM game detection.'
            echo
            if test -f /tmp/scummvm-smoke/scummvm-frame-report.json; then
              python -c 'import json; p=json.load(open("/tmp/scummvm-smoke/scummvm-frame-report.json")); print("- Changed pixels: **{}** (minimum: {})".format(p["changed_pixels"],p["minimum_changed_pixels"])); print("- Frame variation: **{}**".format("PASS" if p["frame_variation_passed"] else "FAIL")); print("- Expected blue-to-orange camera marker: **{}**".format("PASS" if p["scroll_color_signature_passed"] else "FAIL")); print("- Rendered gold key pixels: **{}**".format(p["visible_key_pixels"])); print("- Smooth scrolling and input handling: **not yet proven**")'
              echo '- Start/end screenshots and diff are in the `scummc-research-output` artifact.'
              if test -f /tmp/scummvm-smoke/scummvm-negative-report.json; then
                python -c 'import json; p=json.load(open("/tmp/scummvm-smoke/scummvm-negative-report.json")); print("- Locked door rejects walking through: **{}**".format("PASS" if p["blocked"] else "FAIL"))'
              fi
              if test -f /tmp/scummvm-smoke/scummvm-interaction-report.json; then
                python -c 'import json; p=json.load(open("/tmp/scummvm-smoke/scummvm-interaction-report.json")); print("- Pick up moved key into inventory: **{}**".format("PASS" if p["key_removed_from_room"] else "FAIL")); print("- Inventory gold pixels: **{}**".format(p["inventory_gold_pixels"]))'
              fi
              if test -f /tmp/scummvm-smoke/scummvm-use-report.json; then
                python -c 'import json; p=json.load(open("/tmp/scummvm-smoke/scummvm-use-report.json")); print("- Use Key with Door: **{}**".format("PASS" if p["door_opened"] else "FAIL")); print("- Visible door pixels: **{} -> {}**".format(p["green_before"],p["green_after"]))'
                python -c 'import json; p=json.load(open("/tmp/scummvm-smoke/scummvm-use-report.json")); print("- Open door sprite pixels: **{}**".format(p["open_door_pixels"])); print("- Separate exit click: **{}**".format(p["exit_click"]))'
                python -c 'import json; p=json.load(open("/tmp/scummvm-smoke/scummvm-use-report.json")); print("- Goal reached ({}): **{}**".format(p["goal_room"],"PASS" if p["goal_reached"] else "FAIL"))'
              fi
              if test -f /tmp/scummvm-smoke/scummvm-state-report.json; then
                python -c 'import json; p=json.load(open("/tmp/scummvm-smoke/scummvm-state-report.json")); print("- Room-return object persistence: **{}**".format("PASS" if p["state_preserved"] else "FAIL")); print("- Return open/closed/key pixels: **{}/{}/{}**".format(p["open_door_pixels"],p["closed_door_pixels"],p["key_room_pixels"]))'
              fi
            else
              echo '- Visual comparison: **not produced** (see workflow steps and logs).'
            fi
            if test -f /tmp/story-smoke/scummvm-frame-report.json; then
              python -c 'import json; p=json.load(open("/tmp/story-smoke/scummvm-frame-report.json")); print("- Story JSON to rendered SCUMM room: **{}**".format("PASS" if p["scroll_color_signature_passed"] and p["key_sprite_visible"] else "FAIL"))'
            else
              echo '- Story-built ScummVM preview: **not produced**.'
            fi
            if test -f /tmp/story-smoke/scummvm-use-report.json; then
              python -c 'import json; p=json.load(open("/tmp/story-smoke/scummvm-use-report.json")); print("- Story-derived key-to-door puzzle and goal: **{}**".format("PASS" if p["door_opened"] and p["goal_reached"] else "FAIL"))'
            else
              echo '- Story-derived gameplay test: **not produced**.'
            fi
            if test -f /tmp/two-item-smoke/scummvm-gate-negative-report.json; then
              python -c 'import json; p=json.load(open("/tmp/two-item-smoke/scummvm-gate-negative-report.json")); print("- Two-item prerequisite rejected early unlock: **{}**".format("PASS" if p["blocked"] else "FAIL"))'
            else
              echo '- Two-item prerequisite negative test: **not produced**.'
            fi
            if test -f /tmp/two-item-smoke/scummvm-gate-pickup-report.json; then
              python -c 'import json; p=json.load(open("/tmp/two-item-smoke/scummvm-gate-pickup-report.json")); print("- Additional story-derived pickups transferred into inventory: **{}**".format("PASS" if p["all_acquired"] else "FAIL"))'
            fi
            if test -f /tmp/two-item-smoke/scummvm-use-report.json; then
              python -c 'import json; p=json.load(open("/tmp/two-item-smoke/scummvm-use-report.json")); print("- Two-item door opened and goal reached: **{}**".format("PASS" if p["door_opened"] and p["goal_reached"] else "FAIL"))'
            fi
            if test -f /tmp/three-item-smoke/scummvm-gate-negative-report.json; then
              python -c 'import json; p=json.load(open("/tmp/three-item-smoke/scummvm-gate-negative-report.json")); print("- Three-item puzzle rejected both incomplete inventories: **{}** ({} checks)".format("PASS" if p["blocked"] and len(p["attempts"]) == 2 else "FAIL",len(p["attempts"])))'
            else
              echo '- Three-item prerequisite negative tests: **not produced**.'
            fi
            if test -f /tmp/three-item-smoke/scummvm-use-report.json; then
              python -c 'import json; p=json.load(open("/tmp/three-item-smoke/scummvm-use-report.json")); print("- Three-item puzzle opens door and reaches goal: **{}**".format("PASS" if p["door_opened"] and p["goal_reached"] else "FAIL"))'
            fi
            if test -f /tmp/chain-smoke/scummvm-frame-report.json; then
              python -c 'import json; p=json.load(open("/tmp/chain-smoke/scummvm-frame-report.json")); print("- Three-room chained Story JSON compiled, linked and initial scene rendered: **{}**".format("PASS" if p["frame_variation_passed"] and p["scroll_color_signature_passed"] else "FAIL"))'
            fi
            if test -f /tmp/chain-smoke/scummvm-chain-report.json; then
              python -c 'import json; p=json.load(open("/tmp/chain-smoke/scummvm-chain-report.json")); print("- Chained two-door story reached final scene: **{}**".format("PASS" if p["first_door_opened"] and p["intermediate_room_visible"] and p["second_item_acquired"] and p["second_door_opened"] and p["goal_reached"] else "FAIL"))'
              python -c 'import json; p=json.load(open("/tmp/chain-smoke/scummvm-chain-report.json")); print("- Return through two rooms preserves inventory and open doors: **{}**".format("PASS" if p["returns_preserved"] else "FAIL"))'
            else
              echo '- Full chained gameplay: **not produced**.'
            fi
            if test -f /tmp/recipe-smoke/scummvm-recipe-report.json; then
              python -c 'import json; p=json.load(open("/tmp/recipe-smoke/scummvm-recipe-report.json")); print("- Inventory recipe consumed both ingredients and produced result: **{}**".format("PASS" if p["combined"] else "FAIL"))'
            else
              echo '- Recipe inventory gameplay: **not produced**.'
            fi
            if test -f /tmp/recipe-smoke/scummvm-use-report.json; then
              python -c 'import json; p=json.load(open("/tmp/recipe-smoke/scummvm-use-report.json")); print("- Crafted recipe item unlocked goal room: **{}**".format("PASS" if p["door_opened"] and p["goal_reached"] else "FAIL"))'
            fi
            if test -f /tmp/palette-smoke/palette-report.json; then
              python -c 'import json; p=json.load(open("/tmp/palette-smoke/palette-report.json")); print("- Real SCUMM palette cycling: **{}**, {} observed water colors, static sky: **{}**".format("PASS" if p["passed"] else "FAIL",p["distinct_water_colors"],"PASS" if p["sky_remained_static"] else "FAIL"))'
            else
              echo '- Real SCUMM palette cycling: **not verified**.'
            fi
            if test -f /tmp/music-fixture/tentacle.001; then
              echo '- Original MIDI / GMD resource compiled and linked: **PASS**.'
            else
              echo '- Original MIDI / GMD resource compiled and linked: **not verified**.'
            fi
            if test -f /tmp/music-smoke/audio-report.json; then
              python -c 'import json; p=json.load(open("/tmp/music-smoke/audio-report.json")); print("- Experimental audio PCM activity: **{}** ({} bytes)".format("PASS" if p["pcm_activity_detected"] else "NOT PROVEN",p["bytes"]))'
              python -c 'import json; p=json.load(open("/tmp/music-smoke/audio-report.json")); print("- Music audio exceeds no-music control: **{}**".format("PASS" if p.get("music_signal_above_control") else "NOT PROVEN"))'
            else
              echo '- Experimental audio PCM activity: **not proven**.'
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"
