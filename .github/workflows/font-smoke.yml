name: SCUMM v6 multilingual CHAR resource probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/font-smoke.yml'
      - 'src/adventure_studio/localization.py'
      - 'src/adventure_studio/scumm_font.py'
      - 'src/adventure_studio/scumm_font_probe.py'
      - 'examples/language_probe.json'
      - 'tests/test_localization.py'
      - 'tests/test_scumm_font.py'
  pull_request:
    paths:
      - '.github/workflows/font-smoke.yml'
      - 'src/adventure_studio/localization.py'
      - 'src/adventure_studio/scumm_font.py'
      - 'src/adventure_studio/scumm_font_probe.py'
      - 'examples/language_probe.json'
      - 'tests/test_localization.py'
      - 'tests/test_scumm_font.py'

jobs:
  font:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate language catalogue and glyph constraints
        env:
          PYTHONPATH: src:tests
        run: |
          python -m unittest discover -s tests -p test_localization.py -v
      - name: Install compiler and licensed system fonts
        timeout-minutes: 18
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=45 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=45 install build-essential bison flex xsltproc pkg-config libglib2.0-dev fonts-dejavu-core fonts-ipafont-gothic
          python -m pip install 'Pillow>=10,<13' 'fonttools>=4,<6'
      - name: Build upstream ScummC charset tool
        run: |
          git clone --depth 1 https://github.com/AlbanBedel/scummc.git /tmp/scummc-font-source
          sed -i 's@$(SRCDIR)/man/%.xml@$(SRCDIR)/man/tools/%.xml@g; s@$(SRCDIR)/man/header.xslt@$(SRCDIR)/man/tools/header.xslt@g' /tmp/scummc-font-source/Makefile.target
          cd /tmp/scummc-font-source
          ./configure
          make -j2
          find . -type f -name char -executable -print
      - name: Generate and verify all five languages as real CHAR resource
        env:
          PYTHONPATH: src
        run: |
          CHAR_BIN=$(find /tmp/scummc-font-source -type f -name char -executable -print -quit)
          test -n "$CHAR_BIN"
          LATIN_FONT=$(find /usr/share/fonts -type f -name DejaVuSans.ttf -print -quit)
          CJK_FONT=$(find /usr/share/fonts -type f \( -iname 'ipag.ttf' -o -iname 'ipagp.ttf' \) -print -quit)
          test -n "$LATIN_FONT" && test -n "$CJK_FONT"
          python -m adventure_studio.scumm_font_probe examples/language_probe.json "$LATIN_FONT" "$CJK_FONT" "$CHAR_BIN" /tmp/multilingual-font-proof
          test -s /tmp/multilingual-font-proof/multilingual-font.char
      - name: Upload CHAR, source bitmap and glyph coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-char-resource
          if-no-files-found: ignore
          path: |
            /tmp/multilingual-font-proof/multilingual-font.bmp
            /tmp/multilingual-font-proof/multilingual-font.char
            /tmp/multilingual-font-proof/font-probe-report.json
